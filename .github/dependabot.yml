version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Chicago
    groups:
      flake-inputs:
        patterns: ["*"]
    open-pull-requests-limit: 2
